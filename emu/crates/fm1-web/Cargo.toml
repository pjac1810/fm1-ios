[package]
name = "fm1-web"
description = "The FM-1 emulator for the browser: WebAssembly exports for an AudioWorklet and the front panel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# FM1-iOS: only linked into the iOS static library
crate-type = ["rlib"]

[dependencies]
fm1-core = { path = "../fm1-core" }
fm1-soc = { path = "../fm1-soc" }
